name: CI

# 实测记录（两次跑，都记在这里，免得下一轮又把结论搞错）
#
# ── 第一次，2026-09-29（`819e690`）：前端 job 通过，后端 job 29 failed。
#    原因是**这份注释原来写错了**：它说 Office 相关用例会跳过，但那些标记
#    （requires_soffice / requires_ocr）当时只挂在 test_office_converter.py
#    那一层，API 层的用例一个都没挂，于是它们在没有组件的 runner 上直接断言失败。
#    29 条全部归因于 runner 缺组件，没有一条指向生产代码。已按真实依赖逐个补齐，
#    并在本机用「把组件藏掉」的方式复现验证过：
#        29 failed / 1545 passed / 58 skipped  →  0 failed / 1554 passed / 78 skipped
#    其中 20 条转为跳过、9 条改成按本机实测能力派生期望值后**仍然在跑**（不是跳过）。
#
# ── 第二次，2026-10-04（`f9f4737`）：前端 job 通过；后端 job 前面每一步
#    （安装依赖 / 安装 HEIC 支持 / 安装 LibreOffice / 自检组件）**全部 success**，
#    只有「跑测试」failure。**这一次不是缺组件** —— 按 runner 的同一组件状态
#    （LibreOffice 有、pillow-heif 有、OCR 没有）在本机复现得到
#        1611 passed / 21 skipped / 0 failed
#    全绿。所以失败是 Linux/runner 环境特有的，原因待查（日志正文要仓库管理员
#    权限才下得到，只能靠上面的注解与摘要通道把失败用例名带出来）。
#
#    两次跑的共同点：**都只红在「跑测试」这一步**。所以下面那些装组件、
#    自检的步骤在真实 runner 上确实能用（实测确认，不必再怀疑）。
#
# ── 第四次，2026-10-05（`3cb3442`）：注解终于带出了失败用例名（上一版把
#    pytest 参数写成 `-rs`，把默认的 `-rfE` 顶掉了，等于空转）。14 条失败。
#    其中 **13 条同一个根因，而且是我自己引进来的**：装 `fonts-noto-cjk`
#    之后，它装的 `NotoSansCJK-Regular.ttc` 命中了 config 里 `noto` 的第一
#    候选文件名，于是 TXT→PDF 与 Markdown/HTML→PDF 一起改用它，而 MuPDF
#    读不了这个集合 —— 子集化静默失效（13.7 MB）且抽出来的字被换成
#    NBSP / 非断连字符，引用块整段消失。修法见
#    `backend/config.py::TXT_FONT_FILES_PYMUPDF_CANNOT_READ`。
#    第 14 条（`test_corrupt_document_reports_the_corrupt_message` 期望 400、
#    runner 给 422）**不是字体引起的**，机制已定位到
#    `services/office_converter.py` 押在 soffice 退出码上，尚未修。
#
#    ⚠️ 所以：**这个 job 的「红」不都是环境问题**。装了新组件之后，它可能
#    改变代码在 Linux 上的**默认选择**（这次是默认字体），把生产行为改坏，
#    而本机因为装了别的字体完全看不到。加组件时要想到这一层。
#
# ── 第五次，2026-10-05（`a6e6298`）：修掉字体之后剩 **3 条**，`fonts-noto-cjk`
#    那条根因确实清了（13 条一起没了）。剩下的是
#        test_office_converter.py::test_corrupt_document_reports_the_corrupt_message
#        test_office_api.py::test_corrupt_document_reports_the_corrupt_message
#        test_system_api.py::test_system_api_can_be_switched_off_entirely
#    前两条是 400 vs 422（已在最终收尾那一轮真正修掉，不再押 soffice 退出码）。
#
# ── 第六次，2026-10-08（`ccd322f`）：只剩 **1 条**，就是上面第三条：
#        FAILED tests/test_system_api.py::test_system_api_can_be_switched_off_entirely
#          AssertionError: ('/api/system/workers', {'status': 404, 'content_type': 'application/json'})
#    **这条是本文件这一路上唯一一条真正针对「测试自身写错」的红**，而且它
#    在前五次里每次都在（只是被更多条盖住了），本机却永远绿 —— 因为它验的是
#    「接口关掉之后收到什么」，而那取决于**部署形态**：
#      * 本机 `frontend/dist` 一直在（`npm run build` 的产出，且被 gitignore），
#        main.py 于是挂了 SPA 兜底，未匹配路径回落到 index.html → 200 text/html；
#      * 本 job 只 checkout 后端、从不构建前端 → 没有 dist → 没挂兜底 →
#        FastAPI 自己那条 404，content-type 就是 application/json。
#    而旧断言写的是 `"application/json" not in content_type` —— 它把
#    「不是我们的载荷」错写成了「响应里不许有 JSON」，于是把 FastAPI 的通用
#    404 误判成「接口还在」。两种形态都是真部署（Dockerfile 有
#    `COPY frontend/dist/`，裸 uvicorn 跑未构建前端的检出则是纯 API），
#    所以修法是**两种形状各自钉死**（404 时 body 必须恰好是
#    `{"detail":"Not Found"}`；200 时必须确实是那份 HTML 外壳），比原来更严。
#    本机用「把 frontend/dist 挪走」复现过，改前红、改后绿，两种形态都跑过。

# 覆盖率：装完 LibreOffice 与 pillow-heif（见下面那三步）之后，CI 上真正
# 跳过的只剩 **OCR** 那一批，约 4 条。也就是说：
#   * Office 三个方向（Word / Excel / PowerPoint → PDF）在 CI 上是**真转**的；
#   * PDF → Word 的文字层路径也是真跑的；
#   * HEIC 编解码也是真跑的（pillow-heif 那一步）；
#   * **OCR 那条路径（扫描件）在 CI 上没有验证**。
#
# 为什么偏偏只有 OCR 不装：requirements-ocr.txt 要拖进 onnxruntime + opencv
# （200 MB 上下），而 OCR 又是**逐页串行**的（约 2 秒/页），会明显拖长 job；
# 换来的只有那 4 条。不是装不了，是性价比不合算。它在仓库里，想开就在
# 「安装 HEIC 支持」那步后面再加一行 `pip install -r requirements-ocr.txt`。
#
# ⚠️ pillow-heif 带 libx265（GPLv2），HEVC 另有专利池 —— 在一次性 runner 上
#    装了跑测试**不构成分发**，但如果将来有人把这个 job 改成产出可下载的
#    制品，那个判断就要重新做一遍。许可说明见 backend/requirements-heic.txt。
#
# 真正的全量验收仍是发布前在本机跑满 12 步（scripts/verify_phase*.py 那一串）。

# ⚠️ 下面那三步装组件**尚未在真实 runner 上跑过**：开发机没有 Docker、
#    WSL 也没有发行版，无法在本地复现 Linux 环境。命令按 Ubuntu 24.04 的
#    包名写成，`自检组件` 那一步会在装失败时给出一句能读的原因。
#    首次推上去请看真实日志；若 apt 源或包名有出入，只有那一步会红。
#
#    pillow-heif 那个 pip 步骤倒是查实了两件事（都是直接看真实产物，不是读文档）：
#      1. PyPI 上确有 cp314 的 manylinux x86_64 wheel（本机那份的标签是
#         cp314-cp314-win_amd64，不是 abi3，所以「按版本构建」是真的，
#         当时确实该查一下）；
#      2. 把那份 manylinux wheel 拆开看，pillow_heif.libs/ 里**带**
#         libx265（22.8 MB）、libde265 与 libheif 1.23.4。
#    所以 runner 上 encode 预期为 True。`自检组件` 仍把两个值都打出来，
#    但只在 **decode** 为假时判红（那是包没装成）；encode 为假只发一条
#    ::warning:: 注解 —— 那几格会照旧跳过，不是回归，不该挡路，但也不该
#    悄悄过去。
#
#    Python 3.14 —— 本地实测就是 3.14.5，所以这里写 3.14；若 setup-python
#    在你用的 runner 上还没有 3.14，会在 setup-python 那一步直接报
#    「版本不存在」，与测试无关。
#
#    actions 版本**只升到「换用 Node 24」的那一档**，没跟到最新的 v7：
#      checkout v4→v5 / setup-python v5→v6 / setup-node v4→v5
#    起因是 2026-10-04 那次跑的注解：
#      「Node.js 20 is deprecated. The following actions target Node.js 20
#        but are being forced to run on Node.js 24: actions/checkout@v4,
#        actions/setup-python@v5.」
#   原本这里刻意停在 v4/v5，是为了让首次跑出问题时能确定是哪里红的。
#   那个目的已经达到（首跑与第二跑都只红在「跑测试」），所以现在补上。
#   之所以不跟到 v7：逐个查过这三家的 action.yml，用 node24 的**最小**大版本
#   恰好就是上面这三个，各跨一个大版本；跟到 v7 是跨 2–3 个，多出来的
#   变动对「消掉这条弃用警告」没有贡献。

# ⚠️ CI 里刻意**不跑** scripts/verify_phase*.py：那批脚本要真实 Chromium、
#    要 LibreOffice、要一个常驻的后端进程，12 步串行跑满约 15 分钟，而且
#    必须串行（并发跑必然假红）。它们属于发布前的真机验收，不属于 PR 门禁。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      # HEIC 与 LibreOffice 不同：它是 pip 包不是 apt 包。这份依赖刻意不进
      # requirements.txt（体积，以及 libx265 的 GPLv2 —— 见文件头与
      # backend/requirements-heic.txt），所以单独装。装不上不会有中间态，
      # 下一步 `自检组件` 会当场报出来。
      # 只开 HEIC、不开 OCR：理由写在文件头的「覆盖率」那段。
      - name: 安装 HEIC 支持
        run: pip install -r requirements-heic.txt

      # LibreOffice **不是** runner 预装的（actions/runner-images 的 Ubuntu 24.04
      # 清单里没有它，也没有任何 office 套件），所以这里自己装。
      # 三个组件对应三种输入：writer=Word / calc=Excel / impress=PowerPoint。
      # `/usr/bin/soffice` 由 libreoffice-core 提供，而它是这三个的依赖，
      # 会被一起装上 —— services/office_converter.py 的 _COMMON_DIRS 里
      # 有 /usr/bin，也有 shutil.which("soffice") 兜底，不用改代码。
      #
      # fonts-noto-cjk **不是可选项**。测试样张里有中文
      # （conftest.py: OFFICE_MARKER = "MARKER-测试标记-42"），断言是
      # `assert OFFICE_MARKER in <从转出来的 PDF 里取出的文字>`。
      # 缺字体时 LibreOffice 排不出那几个字、get_text() 也取不回来，
      # 断言会红 —— 而那种红看起来像「转换坏了」，其实是字体没装。
      #
      # --no-install-recommends 砍掉推荐包（Java、字体全家桶、帮助文档等），
      # 装完约几百 MB；带上 recommends 会大得多。
      - name: 安装 LibreOffice（Office 用例要真跑，不是跳过）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            fonts-noto-cjk

      # 早失败：组件没装好就在这里停住，给一句能读的原因，
      # 而不是让后面几十条断言一起红、再去猜是代码坏了还是环境没配好。
      - name: 自检组件
        run: |
          python -c "from services.office_converter import find_soffice; p=find_soffice(); print('soffice =', p); raise SystemExit(0 if p else 'soffice 没找到：LibreOffice 没装成')"
          count=$(fc-list :lang=zh | wc -l)
          echo "中文字体条目 = $count"
          [ "$count" -gt 0 ] || { echo "没有中文字体：中文样张会渲染不出来，Office 用例会红"; exit 1; }
          python - <<'PY'
          import sys

          from compressors.heif import heif_support

          s = heif_support()
          print(f"HEIC decode={s.decode} encode={s.encode} "
                f"pillow-heif={s.package_version} libheif={s.libheif_version}")

          if not s.decode:
              # 包里连 libde265 都在（下面注释记了实测），解不了就是真装坏了。
              raise SystemExit("HEIC 组件不可用：" + (s.reason or "原因未知"))

          if not s.encode:
              # 这份 wheel 实测**带** libx265，所以 encode 为假是反常信号：
              # 那一格会继续跳过（与加这一步之前一样，不是回归），不该把 job
              # 判红挡路，但也绝不该悄悄过去 —— 用 ::warning:: 让它以注解
              # 形式出现在 Actions 界面上。见到它就来查这一条。
              print("::warning title=HEIC 编码方向不可用::"
                    "pillow-heif 装上了、解码也正常，但 encode=False。"
                    "预期这块 wheel 带 libx265，请核对 "
                    "backend/requirements-heic.txt 里的版本与 wheel 内容。")
          PY

      # -o addopts= 是必须的：pytest.ini 里写了 addopts = -q，
      # 不加这个覆盖就没法在命令行上再给别的参数。
      #
      # ⚠️ 必须是 -rfEs，**不能只写 -rs**。`-r` 是**替换**而不是追加：
      #    只写 -rs 会把 pytest 默认的 -rfE 顶掉，短摘要里就只剩 SKIPPED、
      #    一条 FAILED 都没有 —— 而下面那段正是靠 FAILED 行把用例名带出去的。
      #    第三次跑（9437379）就是这么瞎掉的：注解里除了官方那句 exit 1
      #    什么都没有（那是本文件第一次带上诊断通道，等于当场失效）。
      #    实测（同一份含失败与跳过的用例）：
      #        -q -rs    → 短摘要里 0 条 FAILED 行
      #        -q -rfEs  → 1 条 FAILED 行
      #    f=失败 E=错误 s=跳过，三样都要：跳过原因与失败原因一起读才不误导。
      #
      # 输出改成先落盘再转发，是为了**红的时候能把失败用例名带出去**：
      # 日志正文下载要仓库管理员权限，而下面两条通道不用 ——
      #   ① ::error:: 工作流命令 → check-run 的 annotations，
      #      实测可匿名读（GET /repos/{o}/{r}/check-runs/{id}/annotations）；
      #   ② $GITHUB_STEP_SUMMARY → job 页面右上角的摘要。
      # 两条都写：注解是给机器读的那份（我据此定位），摘要是给人读的那份。
      # 这也是 2026-10-04 那次「只知道红在跑测试、不知道红在哪条」的教训 ——
      # 当时只能靠本机复现，而那次复现出来是全绿，等于白跑。
      - name: 跑测试
        run: |
          LOG="$RUNNER_TEMP/pytest.log"
          set +e
          python -m pytest -o addopts= -q -rfEs > "$LOG" 2>&1
          code=$?

          if [ "$code" -ne 0 ]; then
            LIST=$(grep -E '^(FAILED|ERROR)' "$LOG")
            TOTAL=$(printf '%s' "$LIST" | grep -c . || true)

            # 兜底：万一又变成一条 FAILED 都没有（参数被改回去、pytest 换了
            # 输出格式……），也不能像 2026-10-04 那次一样只留一句 exit 1 ——
            # 那等于这一跑白跑。宁可多送几行原文。
            if [ -z "$LIST" ]; then
              echo "::warning title=pytest 没有 FAILED 行::短摘要里一条 FAILED/ERROR 都没有，改为发送日志末尾原文"
              LIST=$(tail -12 "$LOG")
              TOTAL="?"
            fi

            # 逐条发，但**只发前 20 条**：注解在 Actions 界面上能显示的条数
            # 有上限（官方那页没写明数字），失败一多就会溢出。
            #
            # 总数**放在名单前面**发：万一真的溢出被截掉，先丢的也是名单尾部，
            # 而「总共几条」这条信息不会跟着一起没 —— 那样才知道自己看到的
            # 是不是全部。2026-10-05 那次只看到 14 条里的 8 条，就是这么卡的
            # （当时上限写的是 8）。
            SHOWN=20
            if [ "$TOTAL" != "?" ] && [ "$TOTAL" -gt "$SHOWN" ]; then
              echo "::error title=pytest 失败::本次共 $TOTAL 条失败/错误，下面只逐条列前 $SHOWN 条；完整清单在步骤摘要里"
            fi
            printf '%s\n' "$LIST" | head -"$SHOWN" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=pytest 失败::$(printf '%s' "$line" | sed 's/%/%25/g')"
            done

            {
              echo "## pytest 失败（exit $code，共 $TOTAL 条）"
              echo
              echo '```'
              echo "$LIST"
              echo '```'
              echo
              echo "<details><summary>日志末尾 60 行</summary>"
              echo
              echo '```'
              tail -60 "$LOG"
              echo '```'
              echo
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # 末尾照样打到步骤日志里：不红的时候这就是全部的可见输出。
          tail -40 "$LOG"
          exit $code
        env:
          PYTHONIOENCODING: utf-8

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # 版本从仓库根的 .nvmrc 读，不再写死在这里 —— 免得 CI 的 Node 版本
      # 和本地 nvm/fnm 用的对不上，出现「本地能过 CI 不过」这种最难查的分歧。
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # build 脚本本身就是 `tsc --noEmit && vite build`，
      # 所以类型检查和打包一步到位，不需要再单跑 typecheck
      - name: 构建（含类型检查）
        run: npm run build
