name: CI

# ⚠️ 未实测：这份工作流**从未在 GitHub 上跑过**（开发机没有 Docker、也不出网，
#    无法在本地复现 runner 环境）。步骤按本项目已验证的命令写成，但首次推上去
#    可能需要微调。特别提醒两点：
#      1. Python 3.14 —— 本地实测就是 3.14.5，所以这里写 3.14；
#         若 setup-python 在你用的 runner 上还没有 3.14，会直接报「版本不存在」。
#      2. LibreOffice —— runner 上没有装，所以 Office 相关的用例会**跳过**而不是失败
#         （它们挂的是 requires_soffice / requires_ocr 标记，探测不到组件就 skip）。
#         也就是说 CI 全绿**不等于** Office 转换被验证过。
#
# ⚠️ CI 里刻意**不跑** scripts/verify_phase*.py：那批脚本要真实 Chromium、
#    要 LibreOffice、要一个常驻的后端进程，12 步串行跑满约 15 分钟，而且
#    必须串行（并发跑必然假红）。它们属于发布前的真机验收，不属于 PR 门禁。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      # -o addopts= 是必须的：pytest.ini 里写了 addopts = -q，
      # 不加这个覆盖就没法在命令行上再给别的参数。
      - name: 跑测试
        run: python -m pytest -o addopts= -q
        env:
          PYTHONIOENCODING: utf-8

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # build 脚本本身就是 `tsc --noEmit && vite build`，
      # 所以类型检查和打包一步到位，不需要再单跑 typecheck
      - name: 构建（含类型检查）
        run: npm run build
