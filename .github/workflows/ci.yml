name: CI

# 实测记录：2026-09-29 那次 push 上跑过一次 —— 前端 job 通过，后端 job 在
# 「跑测试」处红。原因是**这份注释原来写错了**：它说 Office 相关用例会跳过，
# 但那些标记（requires_soffice / requires_ocr）当时只挂在 test_office_converter.py
# 那一层，API 层的用例一个都没挂，于是它们在没有组件的 runner 上直接断言失败。
# 现在已按真实依赖逐个补齐，并在本机用「把组件藏掉」的方式复现验证过：
#     29 failed / 1545 passed / 58 skipped  →  0 failed / 1554 passed / 78 skipped
# 其中 20 条转为跳过、9 条改成按本机实测能力派生期望值后**仍然在跑**（不是跳过）。

# 覆盖率：装完 LibreOffice 与 pillow-heif（见下面那三步）之后，CI 上真正
# 跳过的只剩 **OCR** 那一批，约 4 条。也就是说：
#   * Office 三个方向（Word / Excel / PowerPoint → PDF）在 CI 上是**真转**的；
#   * PDF → Word 的文字层路径也是真跑的；
#   * HEIC 编解码也是真跑的（pillow-heif 那一步）；
#   * **OCR 那条路径（扫描件）在 CI 上没有验证**。
#
# 为什么偏偏只有 OCR 不装：requirements-ocr.txt 要拖进 onnxruntime + opencv
# （200 MB 上下），而 OCR 又是**逐页串行**的（约 2 秒/页），会明显拖长 job；
# 换来的只有那 4 条。不是装不了，是性价比不合算。它在仓库里，想开就在
# 「安装 HEIC 支持」那步后面再加一行 `pip install -r requirements-ocr.txt`。
#
# ⚠️ pillow-heif 带 libx265（GPLv2），HEVC 另有专利池 —— 在一次性 runner 上
#    装了跑测试**不构成分发**，但如果将来有人把这个 job 改成产出可下载的
#    制品，那个判断就要重新做一遍。许可说明见 backend/requirements-heic.txt。
#
# 真正的全量验收仍是发布前在本机跑满 12 步（scripts/verify_phase*.py 那一串）。

# ⚠️ 下面那三步装组件**尚未在真实 runner 上跑过**：开发机没有 Docker、
#    WSL 也没有发行版，无法在本地复现 Linux 环境。命令按 Ubuntu 24.04 的
#    包名写成，`自检组件` 那一步会在装失败时给出一句能读的原因。
#    首次推上去请看真实日志；若 apt 源或包名有出入，只有那一步会红。
#
#    pillow-heif 那个 pip 步骤倒是查实了两件事（都是直接看真实产物，不是读文档）：
#      1. PyPI 上确有 cp314 的 manylinux x86_64 wheel（本机那份的标签是
#         cp314-cp314-win_amd64，不是 abi3，所以「按版本构建」是真的，
#         当时确实该查一下）；
#      2. 把那份 manylinux wheel 拆开看，pillow_heif.libs/ 里**带**
#         libx265（22.8 MB）、libde265 与 libheif 1.23.4。
#    所以 runner 上 encode 预期为 True。`自检组件` 仍把两个值都打出来，
#    但只在 **decode** 为假时判红（那是包没装成）；encode 为假只发一条
#    ::warning:: 注解 —— 那几格会照旧跳过，不是回归，不该挡路，但也不该
#    悄悄过去。
#
#    Python 3.14 —— 本地实测就是 3.14.5，所以这里写 3.14；若 setup-python
#    在你用的 runner 上还没有 3.14，会在 setup-python 那一步直接报
#    「版本不存在」，与测试无关。
#
#    刻意**没有**顺手把 actions/checkout@v4、setup-python@v5 升到最新：
#    那会在同一次提交里混进第二个未验证的变量。首次跑出问题时，
#    要能确定是哪里红的。

# ⚠️ CI 里刻意**不跑** scripts/verify_phase*.py：那批脚本要真实 Chromium、
#    要 LibreOffice、要一个常驻的后端进程，12 步串行跑满约 15 分钟，而且
#    必须串行（并发跑必然假红）。它们属于发布前的真机验收，不属于 PR 门禁。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      # HEIC 与 LibreOffice 不同：它是 pip 包不是 apt 包。这份依赖刻意不进
      # requirements.txt（体积，以及 libx265 的 GPLv2 —— 见文件头与
      # backend/requirements-heic.txt），所以单独装。装不上不会有中间态，
      # 下一步 `自检组件` 会当场报出来。
      # 只开 HEIC、不开 OCR：理由写在文件头的「覆盖率」那段。
      - name: 安装 HEIC 支持
        run: pip install -r requirements-heic.txt

      # LibreOffice **不是** runner 预装的（actions/runner-images 的 Ubuntu 24.04
      # 清单里没有它，也没有任何 office 套件），所以这里自己装。
      # 三个组件对应三种输入：writer=Word / calc=Excel / impress=PowerPoint。
      # `/usr/bin/soffice` 由 libreoffice-core 提供，而它是这三个的依赖，
      # 会被一起装上 —— services/office_converter.py 的 _COMMON_DIRS 里
      # 有 /usr/bin，也有 shutil.which("soffice") 兜底，不用改代码。
      #
      # fonts-noto-cjk **不是可选项**。测试样张里有中文
      # （conftest.py: OFFICE_MARKER = "MARKER-测试标记-42"），断言是
      # `assert OFFICE_MARKER in <从转出来的 PDF 里取出的文字>`。
      # 缺字体时 LibreOffice 排不出那几个字、get_text() 也取不回来，
      # 断言会红 —— 而那种红看起来像「转换坏了」，其实是字体没装。
      #
      # --no-install-recommends 砍掉推荐包（Java、字体全家桶、帮助文档等），
      # 装完约几百 MB；带上 recommends 会大得多。
      - name: 安装 LibreOffice（Office 用例要真跑，不是跳过）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            fonts-noto-cjk

      # 早失败：组件没装好就在这里停住，给一句能读的原因，
      # 而不是让后面几十条断言一起红、再去猜是代码坏了还是环境没配好。
      - name: 自检组件
        run: |
          python -c "from services.office_converter import find_soffice; p=find_soffice(); print('soffice =', p); raise SystemExit(0 if p else 'soffice 没找到：LibreOffice 没装成')"
          count=$(fc-list :lang=zh | wc -l)
          echo "中文字体条目 = $count"
          [ "$count" -gt 0 ] || { echo "没有中文字体：中文样张会渲染不出来，Office 用例会红"; exit 1; }
          python - <<'PY'
          import sys

          from compressors.heif import heif_support

          s = heif_support()
          print(f"HEIC decode={s.decode} encode={s.encode} "
                f"pillow-heif={s.package_version} libheif={s.libheif_version}")

          if not s.decode:
              # 包里连 libde265 都在（下面注释记了实测），解不了就是真装坏了。
              raise SystemExit("HEIC 组件不可用：" + (s.reason or "原因未知"))

          if not s.encode:
              # 这份 wheel 实测**带** libx265，所以 encode 为假是反常信号：
              # 那一格会继续跳过（与加这一步之前一样，不是回归），不该把 job
              # 判红挡路，但也绝不该悄悄过去 —— 用 ::warning:: 让它以注解
              # 形式出现在 Actions 界面上。见到它就来查这一条。
              print("::warning title=HEIC 编码方向不可用::"
                    "pillow-heif 装上了、解码也正常，但 encode=False。"
                    "预期这块 wheel 带 libx265，请核对 "
                    "backend/requirements-heic.txt 里的版本与 wheel 内容。")
          PY

      # -o addopts= 是必须的：pytest.ini 里写了 addopts = -q，
      # 不加这个覆盖就没法在命令行上再给别的参数。
      # -rs 把跳过原因打出来：OCR / HEIC 的用例在 runner 上会跳过，
      # 「全绿」必须和「跳了多少、为什么跳」一起读（见文件头的说明）。
      - name: 跑测试
        run: python -m pytest -o addopts= -q -rs
        env:
          PYTHONIOENCODING: utf-8

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 版本从仓库根的 .nvmrc 读，不再写死在这里 —— 免得 CI 的 Node 版本
      # 和本地 nvm/fnm 用的对不上，出现「本地能过 CI 不过」这种最难查的分歧。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # build 脚本本身就是 `tsc --noEmit && vite build`，
      # 所以类型检查和打包一步到位，不需要再单跑 typecheck
      - name: 构建（含类型检查）
        run: npm run build
